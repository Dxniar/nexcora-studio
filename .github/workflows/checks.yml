name: Checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-python:
    name: Offline Python (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      TEST_DATABASE_URL: ""
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install locked Python dependencies
        run: python -m pip install --requirement requirements.lock
      - name: Check installed dependencies
        run: python -m pip check
      - name: Legacy and Studio tests without external services
        run: python -m unittest discover -s tests -v

  postgres:
    name: Real PostgreSQL integration
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: nexcora_test
          POSTGRES_USER: nexcora_test
          POSTGRES_PASSWORD: synthetic_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nexcora_test -d nexcora_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 15
    env:
      TEST_DATABASE_URL: postgresql+psycopg://nexcora_test:synthetic_ci_only@127.0.0.1:5432/nexcora_test
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install locked Python dependencies
        run: python -m pip install --requirement requirements.lock
      - name: Require the dedicated disposable database
        run: >-
          python -c "import os; from sqlalchemy.engine import make_url;
          u=make_url(os.environ['TEST_DATABASE_URL']);
          assert u.database == 'nexcora_test', 'A dedicated nexcora_test database is required';
          assert u.drivername == 'postgresql+psycopg'"
      - name: Install matching PostgreSQL backup tools
        # https://www.postgresql.org/download/linux/ubuntu/
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl --fail --silent --show-error --location https://www.postgresql.org/media/keys/ACCC4CF8.asc --output /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
          sudo tee /etc/apt/sources.list.d/pgdg.sources > /dev/null <<'PGDG'
          Types: deb
          URIs: https://apt.postgresql.org/pub/repos/apt
          Suites: noble-pgdg
          Architectures: amd64
          Components: main
          Signed-By: /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
          PGDG
          sudo apt-get update
          sudo apt-get install --yes postgresql-client-17
          echo "PG_BIN=/usr/lib/postgresql/17/bin" >> "$GITHUB_ENV"
          /usr/lib/postgresql/17/bin/pg_dump --version
          /usr/lib/postgresql/17/bin/pg_restore --version
      - name: Migrate the actual test database twice and check its schema
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
        run: |
          python -m nexcora_studio.cli migrate
          python -m nexcora_studio.cli migrate
          python -m nexcora_studio.cli check
      - name: Full regression including PostgreSQL transactions and races
        run: python -m unittest discover -s tests -v

  frontend:
    name: Frontend and browser flows
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHON: python
      TEST_DATABASE_URL: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.lock
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install locked dependencies
        run: |
          python -m pip install --requirement requirements.lock
          npm ci --prefix web
      - name: Typecheck
        run: npm --prefix web run typecheck
      - name: Production build
        run: npm --prefix web run build
      - name: Install Chromium for the browser checks
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: Run actual browser scenarios against isolated fixtures
        run: npm --prefix web run test:e2e
      - name: Upload synthetic browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failure-evidence
          path: web/artifacts/test-results/
          retention-days: 7
          if-no-files-found: ignore

  container:
    name: Container build
    needs: [offline-python, postgres, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build the deployable image without credentials or local data
        run: docker build --tag nexcora-studio:ci .
      - name: Verify runtime files and imports without starting polling
        run: >-
          docker run --rm --entrypoint python nexcora-studio:ci -c
          "from pathlib import Path; import nexcora_studio.app; import orderbot.catalog;
          assert Path('web/dist/index.html').is_file();
          assert Path('alembic.ini').is_file();
          assert Path('migrations/env.py').is_file();
          assert not Path('.env').exists(); assert not Path('data').exists();
          assert not Path('tests').exists(); assert not Path('web/e2e').exists()"
