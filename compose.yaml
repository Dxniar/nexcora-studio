services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: nexcora_test
      POSTGRES_USER: nexcora_local
      POSTGRES_PASSWORD: local_development_only
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - studio_local_pg:/var/lib/postgresql/data
    mem_limit: 512m
    cpus: 1.0
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexcora_local -d nexcora_test"]
      interval: 5s
      timeout: 3s
      retries: 15
volumes:
  studio_local_pg:
